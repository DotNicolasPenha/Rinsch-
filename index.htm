<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fisch v6.8 - Skull & Abyss Update</title>
<style>
:root{--bg:#0f0f0f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0f}}
:root[data-theme="dark"]{--bg:#0f0f0f}

body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
canvas{display:block;width:min(100vw,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 16 / 9));height:auto;aspect-ratio:16/9;user-select:none;-webkit-user-select:none;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const SW=1280,SH=720,WW=5400,WH=4000;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const k=(r,b,c)=>`rgb(${r},${b},${c})`;
const OCEAN=k(15,75,130),SAND=k(222,184,135),DGRAY=k(35,35,45),WHITE=k(255,255,255),BLACK=k(15,15,15),GRAY=k(120,120,120),
GOLD=k(241,196,15),YELLOW=k(255,235,59),CYAN=k(0,230,240),PURPLE=k(155,89,182),GREEN=k(46,204,113),RED=k(231,76,60),ORANGE=k(230,126,34);
const R=(x,y,w,h)=>({x,y,w,h});
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const inf=(r,dx,dy)=>R(r.x-dx/2,r.y-dy/2,r.w+dx,r.h+dy);
const pt=(r,m)=>m.x>=r.x&&m.x<r.x+r.w&&m.y>=r.y&&m.y<r.y+r.h;
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const now=()=>performance.now();

// ---------- DADOS ----------
const WEATHER={Ensolarado:{luck:1.0,color:YELLOW},Chuvoso:{luck:1.3,color:k(52,152,219)},Neblina:{luck:1.25,color:k(180,180,200)},Tempestade:{luck:1.8,color:PURPLE},Eclipse:{luck:5.0,color:RED}};
const RI={
 "Comum":{chance:42,speed:3.0,price:10,xp:40,color:k(190,190,190)},
 "Incomum":{chance:26,speed:4.2,price:25,xp:95,color:GREEN},
 "Raro":{chance:16,speed:5.5,price:70,xp:220,color:k(52,152,219)},
 "Épico":{chance:9,speed:7.0,price:180,xp:550,color:PURPLE},
 "Lendário":{chance:4,speed:8.8,price:500,xp:1600,color:GOLD},
 "Mítico":{chance:2,speed:10.5,price:1600,xp:4500,color:k(233,30,99)},
 "SECRETO":{chance:1,speed:12.5,price:5000,xp:15000,color:RED},
 "Divina":{chance:0,speed:13.5,price:25000,xp:55000,color:k(8,168,163)}};
const MASTER={name:"VARA MASTERLINE",price:0,bar_size:378,luck:33.3,req_level:100,progress_mult:4.0,instant_bite:true,resilience:77,color:k(255,0,255),decor:"masterline"};
const rd=(name,price,bar_size,luck,req_level,resilience,color,decor)=>({name,price,bar_size,luck,req_level,resilience,color,decor});
const F=(Comum,Incomum,Raro,Épico,Lendário,Mítico,SECRETO)=>({Comum,Incomum,Raro,Épico,Lendário,Mítico,SECRETO});
const L=(name,req_level,color,r,fish)=>({name,req_level,color,rect:R(...r),fish});
const ISL={
inicial:{name:"Ilha Inicial",rect:R(200,200,700,600),color:k(34,139,34),border:SAND,vendor:R(420,280,50,50),rodnpc:R(540,280,50,50),boat:R(660,280,50,50),money_buff:1.1,
 rods:{bambu:rd("Vara de Bambu",0,80,1.0,1,0,k(139,90,43),"bambu"),fibra:rd("Vara de Fibra de Vidro",665,95,1.25,2,5,k(240,240,240),"fibra"),
  ouro:rd("Vara de Ouro Reluzente",3150,115,1.6,4,10,k(255,215,0),"ouro"),mitica:rd("Vara Mítica do Mar",10500,135,2.2,7,15,k(0,150,255),"mitica")},
 lakes:{Lagoa:L("Lagoa Tranquila",1,k(30,144,255),[260,420,220,180],F(["Tilápia","Lambari","Sardinha"],["Carpa Dourada","Tucunaré"],["Tambaqui","Pirarucu"],["Peixe-Dourado Gigante"],["Arowana Anciã"],["Guardião da Lagoa"],["Anomalia Fluorescente"])),
  Vulcão:L("Poço Vulcânico",6,k(200,50,20),[580,420,220,180],F(["Cascudo Magmático"],["Peixe-Pedra Incandescente"],["Salamandra de Fogo"],["Anguila de Lava"],["Fênix Aquática"],["Dragão Magmático"],["Coração do Vulcão"]))}},
pedra:{name:"Ilha da Pedra",rect:R(1800,200,800,700),color:k(100,100,105),border:k(60,60,65),vendor:R(2000,300,50,50),rodnpc:R(2150,300,50,50),money_buff:1.5,
 rods:{granito:rd("Vara de Granito Sólido",24500,140,2.8,10,20,k(120,120,130),"granito"),basalto:rd("Vara de Basalto Vulcânico",52500,150,3.4,15,25,k(45,45,50),"basalto")},
 lakes:{BasePedra:L("Lago da Base da Pedra",10,k(70,130,180),[1880,450,280,200],F(["Cascudo das Pedras","Carpa Rochosa"],["Bagre das Cavernas","Truta Escondida"],["Peixe Golem","Trilobita Fossilizado"],["Guardião de Granito"],["Monolito Aquático"],["Sirenita de Pedra"],["Ancestral Geodésico"])),
  PicoPedra:L("Lago Do Pico da Pedra",15,k(100,180,220),[2240,450,280,200],F(["Truta Montanhesa","Salmão das Alturas"],["Peixe Vento de Pedra"],["Cristal de Rocha Vivo"],["Águia dos Mares da Montanha"],["Titã dos Picos"],["Dragão dos Despenhadeiros"],["Divindade do Cume"]))}},
cristais:{name:"Ilha dos Cristais",rect:R(300,1800,850,750),color:k(45,20,70),border:k(180,100,255),vendor:R(500,1900,50,50),rodnpc:R(650,1900,50,50),money_buff:2.2,
 rods:{prismatica:rd("Vara Prismática Radiante",126000,160,4.2,20,40,k(255,105,180),"prismatica"),nucleo_cristal:rd("Vara Núcleo de Cristal",280000,175,5.2,25,20,k(148,0,211),"nucleo_cristal")},
 lakes:{LagoCalmo:L("Lago Calmo",20,k(120,220,230),[380,2080,300,220],F(["Peixe Esmeralda","Quartzo Rosa Natante"],["Safira Aquática"],["Lotus de Cristal Bioluminescente"],["Arraia Prismática"],["Dragão de Cristal Calmo"],["Serafim de Ametista"],["Singularidade Prismática"])),
  LagoCristalizado:L("Lago Cristalizado",25,k(200,130,255),[740,2080,300,220],F(["Diamante Bruto Nadador"],["Peixe Espelho Multifacetado"],["Espectro Diamantado"],["Quimera de Cristal"],["Lorde dos Cristais"],["Fênix de Diamante"],["O Coração Prisma"]))}},
marianas:{name:"Ilha Fossa das Marianas",rect:R(2000,1800,950,850),color:k(15,15,25),border:k(50,50,100),vendor:R(2200,1900,50,50),rodnpc:R(2350,1900,50,50),money_buff:3.2,
 rods:{sombra_abissal:rd("Vara das Sombras Abissais",378000,190,6.8,30,30,k(20,20,35),"sombra_abissal"),vazio_hadal:rd("Vara do Vazio Hadal",1050000,210,7.5,40,45,k(10,0,20),"vazio_hadal")},
 lakes:{LagoAbyssal:L("Lago Abyssal",30,k(15,30,60),[2080,2100,340,250],F(["Peixe Lanterninha Abissal"],["Enguia das Sombras"],["Lula Colossal Abissal"],["Devorador de Luz"],["Leviatã da Penumbra"],["Behemoth Abissal"],["O Espírito do Abismo"])),
  LagoHadal:L("Lago Hadal",40,k(5,5,15),[2500,2100,340,250],F(["Peixe Escuridão Hadal"],["Anglerfish Ancestral"],["Hidra das Profundezas Hadais"],["Kraken Sem Fim"],["Titã do Vazio Hadal"],["Sultão das Trevas Aquáticas"],["A Singularidade Hadal"]))}},
caveira:{name:"Ilha da Caveira",rect:R(4000,1800,950,850),color:k(40,35,45),border:k(120,30,30),vendor:R(4200,1900,50,50),rodnpc:R(4350,1900,50,50),money_buff:5.0,
 rods:{esqueleto_maldito:rd("Vara do Esqueleto Maldito",1260000,225,9.0,50,10,k(180,180,180),"esqueleto_maldito"),ceifador_almas:rd("Ceifadeira de Almas",3150000,245,12.0,60,0,k(20,20,25),"ceifador_almas")},
 lakes:{LagoOssos:L("Lago de Ossos",50,k(90,70,70),[4080,2100,340,250],F(["Piranha Esquelética"],["Carpa de Marfim"],["Tubarão Fantasma Ósseo"],["Serpente dos Túmulos"],["Guardião da Cripta"],["Lord dos Ossos Eternos"],["Fóssil Primordial Desperto"])),
  LagoProfano:L("Lago Profano",60,k(30,10,20),[4500,2100,340,250],F(["Enguia Necrótica"],["Arraia Sangrenta"],["Espectro das Profundezas Cegas"],["Leviathan da Pira"],["Archdemon Aquático"],["Deus Caído do Lago Profano"],["A essência do Caos Sombrio"]))}}};
const BOATS={pe:{name:"A Pé",price:0,speed:1.0},bote:{name:"Bote de Madeira",price:5000,speed:2.0},speedboat:{name:"Speedboat Ultra",price:60000,speed:4.0}};
const BAITS={minhoca:{name:"Minhoca Comum",price:0,luck:1.0},camarao:{name:"Camarão Suculento",price:500,luck:1.4,pack:5},brilhante:{name:"Isca Mágica Brilhante",price:2000,luck:2.2,pack:3}};
const allSpecies=()=>{const s=new Set();for(const i of Object.values(ISL))for(const l of Object.values(i.lakes))for(const r of Object.values(l.fish))r.forEach(n=>s.add(n));s.add("Eclipse Ancient Serpent");return s};
const allRods=()=>{const s=new Set();for(const i of Object.values(ISL))Object.keys(i.rods).forEach(r=>s.add(r));return s};
const rodData=key=>{if(key==="masterline")return MASTER;for(const i of Object.values(ISL))if(i.rods[key])return i.rods[key];return ISL.inicial.rods.bambu};
const findRarity=sp=>{if(sp==="Eclipse Ancient Serpent")return"Divina";for(const i of Object.values(ISL))for(const l of Object.values(i.lakes))for(const[r,a]of Object.entries(l.fish))if(a.includes(sp))return r;return"Comum"};

// ---------- ESTADO ----------
const p={x:400,y:350,base:7,radius:16,coins:150,level:1,xp:0,xpNext:70,rod:"bambu",rods:["bambu"],boat:"pe",boats:["pe"],bait:"minhoca",baits:{camarao:0,brilhante:0},inv:[],best:{},inWater:false};
let state="MENU",activeLake=null,activeIsland=null,waitTimer=0,caught=null;
let weather="Ensolarado",weatherTimer=0,eclZone=null,eclMsg=0,eclGuar=false,isEcl=false;
const TW=420;let fishPos=210,fishTarget=210,barPos=150,barVel=0,progress=30,curFish=null,perfect=true;
let particles=[],ftexts=[],toastMsg="",toastTimer=0,bestPage=0,invScroll=0,dragInv=false,invY=0,favBtns=[],shopType=null,shopIsl=null;
const cam={x:0,y:0};
const joy={c:[110,SH-110],r:65,hr:28,active:false,id:null,pos:[110,SH-110],vec:[0,0]};
const btnAction=R(SW-135,SH-135,105,105),btnInv=R(SW-250,12,110,36),btnBest=R(SW-130,12,115,36),btnPlay=R(530,400,220,65);
let touchAction=false,hover={x:0,y:0};
const keys=new Set(),ptrs=new Map();
const pRect=(x=p.x,y=p.y)=>R(x-p.radius,y-p.radius,p.radius*2,p.radius*2);

// ---------- SAVE ----------
function save(){try{localStorage.setItem("fisch_save",JSON.stringify({x:p.x,y:p.y,coins:p.coins,level:p.level,xp:p.xp,xpNext:p.xpNext,rod:p.rod,rods:p.rods,boat:p.boat,boats:p.boats,bait:p.bait,baits:p.baits,inv:p.inv,best:p.best}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem("fisch_save")||"null");if(!d)return;Object.assign(p,d);
 p.inv.forEach(f=>{f.favorited=!!f.favorited;f.is_shiny=!!f.is_shiny;f.is_sparkling=!!f.is_sparkling});
 for(const[n,f]of Object.entries(p.best))if(!f.rarity||!RI[f.rarity])f.rarity=findRarity(n)}catch(e){}}
addEventListener("beforeunload",save);document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});

// ---------- UTIL ----------
const toast=s=>{toastMsg=s;toastTimer=now()+3000};
const ftext=(x,y,t,c)=>ftexts.push({x,y,t,c,life:40});
const sparkle=(x,y,c,n=15)=>{for(let i=0;i<n;i++)particles.push({x,y,c,vx:rnd(-3,3),vy:rnd(-3,3),s:ri(3,7),life:ri(15,30)})};
function addXp(a){p.xp+=a;ftext(p.x,p.y-30,`+${a} XP`,CYAN);while(p.xp>=p.xpNext){p.xp-=p.xpNext;p.level++;p.xpNext=Math.floor(p.xpNext*1.175);toast(` SUBIU PARA O NÍVEL ${p.level}! `);sparkle(p.x,p.y,GOLD,20)}}
function checkMaster(){
 if(p.rods.includes("masterline"))return;
 const sp=[...allSpecies()].every(s=>s in p.best),rods=[...allRods()].every(r=>p.rods.includes(r)),boats=Object.keys(BOATS).every(b=>p.boats.includes(b));
 if(sp&&rods&&boats&&p.level>=100&&p.coins>=5000000){p.rods.push("masterline");p.rod="masterline";toast(" CONQUISTA SUPREMA! Você obteve a VARA MASTERLINE! ");sparkle(p.x,p.y,k(255,0,255),30);save()}}
function onLand(r){for(const i of Object.values(ISL))if(hit(i.rect,r)&&!Object.values(i.lakes).some(l=>hit(l.rect,r)))return true;return false}
function move(dx,dy){
 if(!dx&&!dy)return;
 const sp=p.base*(p.boat!=="pe"?BOATS[p.boat].speed:1);
 const nx=Math.max(20,Math.min(WW-20,p.x+dx*sp));
 if(p.boat!=="pe"){p.x=nx}else if(onLand(pRect(nx,p.y)))p.x=nx;
 const ny=Math.max(20,Math.min(WH-20,p.y+dy*sp));
 if(p.boat!=="pe"){p.y=ny}else if(onLand(pRect(p.x,ny)))p.y=ny;
 p.inWater=!onLand(pRect());
}

// ---------- CLIMA / ECLIPSE ----------
function spawnEclipse(){
 for(let i=0;i<150;i++){const c=R(ri(100,WW-500),ri(100,WH-500),400,400);if(!Object.values(ISL).some(s=>hit(c,inf(s.rect,100,100)))){eclZone=c;return}}
 eclZone=R(1200,1200,400,400)}
function changeWeather(n){
 if(!n)n=pick(Object.keys(WEATHER).filter(w=>w!=="Eclipse"&&w!==weather));
 weather=n;weatherTimer=now()+60000;
 if(n==="Eclipse"){eclMsg=now()+10000;eclGuar=true;spawnEclipse();toast("UM SER DIVINO SURGIU NO OCEANO!")}
 else{eclZone=null;eclGuar=false;isEcl=false;toast(` CLIMA MUDOU: ${n.toUpperCase()} (${WEATHER[n].luck}x Sorte)!`)}}

// ---------- PESCA ----------
function wchoice(items,w){let t=w.reduce((a,b)=>a+b,0),r=Math.random()*t;for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i]}return items[items.length-1]}
function getFish(lake){
 const var2=()=>[Math.random()<0.01,Math.random()<0.03];
 if(isEcl&&eclGuar){
  eclGuar=false;const info=RI.Divina,[sh,sp]=var2();let pr=info.price;
  if(activeIsland&&ISL[activeIsland])pr*=ISL[activeIsland].money_buff;
  if(sh)pr*=2;if(sp)pr*=1.5;
  return{name:"Eclipse Ancient Serpent",rarity:"Divina",weight:Math.round(rnd(250,800)*100)/100,price:Math.floor(pr),xp:info.xp,color:info.color,speed:info.speed,lake:"Oceano do Eclipse",favorited:false,is_shiny:sh,is_sparkling:sp}}
 const rod=rodData(p.rod),luck=rod.luck*BAITS[p.bait].luck*WEATHER[weather].luck;
 const rars=Object.keys(RI).filter(r=>r!=="Divina");
 let av=rars.filter(r=>lake.fish[r]&&lake.fish[r].length>0);if(!av.length)av=["Comum"];
 const w=av.map(r=>["Raro","Épico","Lendário","Mítico","SECRETO"].includes(r)?RI[r].chance*luck:RI[r].chance);
 const rar=wchoice(av,w);
 if(p.bait!=="minhoca"){p.baits[p.bait]=Math.max(0,p.baits[p.bait]-1);if(p.baits[p.bait]<=0){p.bait="minhoca";toast("Sua isca acabou! Voltando para Minhoca.")}}
 const name=pick(lake.fish[rar]&&lake.fish[rar].length?lake.fish[rar]:["Peixe Abissal Misterioso"]);
 const info=RI[rar],weight=Math.round(rnd(1,["Mítico","SECRETO"].includes(rar)?250:40)*100)/100;
 let price=Math.floor(info.price*(weight/5)+info.price*0.2);
 if(activeIsland&&ISL[activeIsland])price=Math.floor(price*ISL[activeIsland].money_buff);
 const lv=lake.req_level||1,mult=lv>=50?1+lv*1.8:lv>=30?1+lv*1.2:1+lv*0.65;
 const[sh,sp]=var2();let fp=price;if(sh)fp*=2;if(sp)fp*=1.5;
 return{name,rarity:rar,weight,price:Math.floor(fp),xp:Math.floor(info.xp*mult),color:info.color,speed:info.speed,lake:lake.name,favorited:false,is_shiny:sh,is_sparkling:sp}}
function startFishing(lake,isl,ecl=false){
 if(state!=="EXPLORING")return;
 if(!ecl&&p.level<lake.req_level){toast(`Requer Nível ${lake.req_level} para pescar aqui!`);return}
 activeLake=lake;activeIsland=isl;isEcl=ecl;
 if(rodData(p.rod).instant_bite)startMini();else{state="WAITING_BITES";waitTimer=now()+ri(1200,2800)}}
function startMini(){
 if(state!=="EXPLORING"&&state!=="WAITING_BITES")return;
 state="MINIGAME";curFish=getFish(activeLake);perfect=true;fishPos=TW/2;
 barPos=(TW-rodData(p.rod).bar_size)/2;barVel=0;progress=35;fishTarget=ri(20,TW-20)}
const RMULT={"Lendário":0.7,"Mítico":0.4,"SECRETO":0.3,"Divina":0.25};
function updMini(held){
 if(state!=="MINIGAME"||!curFish)return;
 const rod=rodData(p.rod),bs=rod.bar_size,rm=Math.max(0.05,1-(rod.resilience||0)/100);
 if(Math.abs(fishPos-fishTarget)<15||Math.random()<0.05*rm)fishTarget=ri(20,TW-20);
 fishPos+=(fishTarget>fishPos?1:-1)*curFish.speed*0.85*rm;
 fishPos=Math.max(10,Math.min(TW-10,fishPos));
 barVel+=held?3.2:-3.2;barVel=Math.max(-15,Math.min(15,barVel));barPos+=barVel;
 if(barPos<0){barPos=0;barVel=0}else if(barPos>TW-bs){barPos=TW-bs;barVel=0}
 const inZone=barPos<=fishPos&&fishPos<=barPos+bs,ps=1.4*(rod.progress_mult||1)*(RMULT[curFish.rarity]||1);
 if(inZone){progress+=ps;if(Math.random()<0.2)particles.push({x:SW/2-TW/2+fishPos,y:SH/2,c:curFish.color,vx:rnd(-3,3),vy:rnd(-3,3),s:ri(3,7),life:10})}
 else{progress-=0.8;perfect=false}
 progress=Math.max(0,Math.min(100,progress));
 if(progress>=100){
  state="RESULT";
  if(perfect){curFish.xp=Math.floor(curFish.xp*1.5);toast("CAPTURA PERFEITA! 1.5x XP!")}
  caught=curFish;p.inv.push(curFish);addXp(curFish.xp);
  const n=curFish.name;if(!p.best[n])p.best[n]={caught:0,max_weight:0,rarity:curFish.rarity};
  p.best[n].caught++;p.best[n].max_weight=Math.max(p.best[n].max_weight,curFish.weight);p.best[n].rarity=curFish.rarity;
  sparkle(p.x,p.y,curFish.color,25);checkMaster();save();isEcl=false}
 else if(progress<=0){state="RESULT";caught=null;isEcl=false}}

// ---------- INTERAÇÃO ----------
function interact(){
 if(["SHOP","INVENTORY","BESTIARY","RESULT"].includes(state)){if(state==="RESULT")caught=null;state="EXPLORING";return}
 if(state!=="EXPLORING")return;
 const pr=pRect();
 if(weather==="Eclipse"&&eclZone&&hit(pr,eclZone)){
  startFishing({name:"Linha Divina do Eclipse",req_level:1,color:RED,fish:{"Mítico":["Ser do Vazio"],"SECRETO":["Abismo Vivo"]}},null,true);return}
 for(const[ik,isl]of Object.entries(ISL)){
  for(const lake of Object.values(isl.lakes))if(hit(pr,inf(lake.rect,20,20))){startFishing(lake,ik);return}
  if(hit(pr,inf(isl.vendor,30,30))){
   if(!p.inv.length)toast("Você não tem peixes para vender!");
   else{const un=p.inv.filter(f=>!f.favorited);
    if(!un.length)toast("Todos os peixes estão favoritados e protegidos!");
    else{const t=un.reduce((a,f)=>a+f.price,0);p.coins+=t;ftext(p.x,p.y-20,`+C$ ${t}`,GOLD);p.inv=p.inv.filter(f=>f.favorited);toast(`Vendeu ${un.length} peixes por C$ ${t}!`);checkMaster();save()}}
   return}
  if(hit(pr,inf(isl.rodnpc,30,30))){state="SHOP";shopType="rod";shopIsl=ik;return}
  if(isl.boat&&hit(pr,inf(isl.boat,30,30))){state="SHOP";shopType="boat";shopIsl=ik;return}}}
function shopClick(m){
 const sx=SW/2-280,sy=SH/2-250;
 if(pt(R(sx+515,sy+10,30,30),m)){state="EXPLORING";return}
 if(shopType==="rod"){
  let y=sy+65;
  for(const[key,r]of Object.entries(ISL[shopIsl].rods)){
   if(pt(R(sx+400,y+5,130,30),m)){
    if(p.rods.includes(key)){p.rod=key;toast(`Equipou: ${r.name}`)}
    else if(p.level<r.req_level)toast(`Requer Nível ${r.req_level}!`);

function updJoy(){
 let m=null;
 if(joy.active){m=ptrs.get(joy.id);if(!m)joy.active=false}
 else for(const[id,q]of ptrs)if(Math.hypot(q.x-joy.c[0],q.y-joy.c[1])<=joy.r+20){joy.active=true;joy.id=id;m=q;break}
 if(joy.active&&m){
  const dx=m.x-joy.c[0],dy=m.y-joy.c[1],d=Math.hypot(dx,dy);
  if(d<=joy.r){joy.pos=[m.x,m.y];joy.vec=d>0?[dx/joy.r,dy/joy.r]:[0,0]}
  else{const a=Math.atan2(dy,dx);joy.pos=[joy.c[0]+joy.r*Math.cos(a),joy.c[1]+joy.r*Math.sin(a)];joy.vec=[Math.cos(a),Math.sin(a)]}
 }else{joy.active=false;joy.pos=[...joy.c];joy.vec=[0,0]}
 touchAction=[...ptrs.values()].some(q=>pt(btnAction,q))}
